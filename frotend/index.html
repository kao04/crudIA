<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineStudio - Catálogo de Filmes</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Fundo dinâmico com luzes sutis -->
    <div class="ambient-background">
        <div class="glow-spot spot-1"></div>
        <div class="glow-spot spot-2"></div>
    </div>

    <!-- Header Principal -->
    <header class="app-header">
        <div class="header-container">
            <div class="brand-logo">
                <div class="logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/></svg>
                </div>
                <div>
                    <h1>CineStudio</h1>
                    <p class="brand-subtitle">Catálogo do Backend de Filmes</p>
                </div>
            </div>

            <div class="header-actions">
                <div class="api-selector" title="Servidor Backend em Execução">
                    <span class="api-indicator"></span>
                    <select id="apiSelect" onchange="alterarApi(this.value)">
                        <option value="https://crudfilmes-88qu.vercel.app">API Nuvem (Vercel)</option>
                        <option value="http://localhost:8080">API Local (Porta 8080)</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="abrirModalCadastro()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                    <span>Novo Filme</span>
                </button>
                <a href="./cadastrar/cadastrar.html" class="btn btn-secondary btn-icon-only" title="Página dedicada de cadastro">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></svg>
                </a>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="main-content">
        <!-- Barra de Filtros e Estatísticas -->
        <section class="controls-bar">
            <div class="search-box">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="text" id="searchInput" placeholder="Buscar filmes por título ou gênero..." oninput="filtrarFilmes()">
                <button class="clear-search" id="btnClearSearch" onclick="limparBusca()" style="display: none;">&times;</button>
            </div>

            <div class="filter-group">
                <select id="genreFilter" onchange="filtrarFilmes()">
                    <option value="">Todos os Gêneros</option>
                </select>
                
                <div class="stats-badge">
                    <span id="totalFilmesCount">0</span> Filmes
                </div>
            </div>
        </section>

        <!-- Grid de Cards dos Filmes -->
        <section class="filmes-section">
            <div id="filmesGrid" class="filmes-grid">
                <!-- Skeleton Loading Inicial -->
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>

            <!-- Estado Vazio -->
            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 8 6 4-6 4Z"/></svg>
                </div>
                <h3>Nenhum filme encontrado</h3>
                <p>Não encontramos nenhum filme correspondente à sua pesquisa ou banco de dados.</p>
                <button class="btn btn-secondary" onclick="limparBusca()">Limpar Pesquisa</button>
            </div>
        </section>
    </main>

    <!-- Modal de Cadastro Rápidos -->
    <div id="modalCadastro" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Cadastrar Novo Filme</h2>
                <button class="btn-close" onclick="fecharModalCadastro()">&times;</button>
            </div>
            <form id="formCadastro" onsubmit="salvarNovoFilme(event)">
                <div class="form-group">
                    <label for="addTitle">Título do Filme</label>
                    <input type="text" id="addTitle" placeholder="Ex: Interstellar" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="addGender">Gênero</label>
                        <input type="text" id="addGender" placeholder="Ex: Ficção Científica" required>
                    </div>
                    <div class="form-group">
                        <label for="addDuration">Duração (minutos)</label>
                        <input type="number" id="addDuration" placeholder="Ex: 169" min="1" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="addAgeLimit">Classificação Indicativa (idade)</label>
                    <input type="number" id="addAgeLimit" placeholder="Ex: 10 (0 para Livre)" min="0" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-tertiary" onclick="fecharModalCadastro()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnSubmitAdd">Adicionar Filme</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Edição de Filme -->
    <div id="modalEdicao" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Editar Filme</h2>
                <button class="btn-close" onclick="fecharModalEdicao()">&times;</button>
            </div>
            <form id="formEdicao" onsubmit="salvarEdicaoFilme(event)">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label for="editTitle">Título do Filme</label>
                    <input type="text" id="editTitle" placeholder="Digite o novo título" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="editGender">Gênero</label>
                        <input type="text" id="editGender" placeholder="Digite o gênero" required>
                    </div>
                    <div class="form-group">
                        <label for="editDuration">Duração (minutos)</label>
                        <input type="number" id="editDuration" placeholder="Duração em min" min="1" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="editAgeLimit">Classificação Indicativa (idade)</label>
                    <input type="number" id="editAgeLimit" placeholder="Classificação (ex: 12)" min="0" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-tertiary" onclick="fecharModalEdicao()">Cancelar</button>
                    <button type="submit" class="btn btn-accent" id="btnSubmitEdit">Atualizar Filme</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Confirmação de Deleção -->
    <div id="modalDelecao" class="modal-overlay" style="display: none;">
        <div class="modal-card modal-card-danger">
            <div class="modal-header">
                <div class="danger-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
                </div>
                <div>
                    <h2>Excluir Filme</h2>
                    <p class="modal-subtitle">Esta ação não pode ser desfeita.</p>
                </div>
            </div>
            <div class="modal-body">
                <p>Tem certeza que deseja apagar o filme <strong id="deleteMovieTitle">""</strong>?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-tertiary" onclick="fecharModalDelecao()">Cancelar</button>
                <button type="button" class="btn btn-danger" id="btnConfirmDelete" onclick="executarExclusao()">Apagar Filme</button>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="script.js"></script>
</body>

</html>
